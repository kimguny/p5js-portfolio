<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js 작품 모음</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #e8f4fd 0%, #f0e8fb 30%, #fce8f4 60%, #e8edfb 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px 64px;
      }

      header {
        text-align: center;
        margin-bottom: 48px;
      }

      .subtitle {
        font-size: 0.85rem;
        font-weight: 300;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a98fc4;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 2.2rem;
        font-weight: 700;
        background: linear-gradient(120deg, #7bb3e8, #b07de8, #e07bb0, #7baee8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
        line-height: 1.2;
      }

      .desc {
        font-size: 0.95rem;
        color: #8a8aaa;
        font-weight: 300;
      }

      #projects {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        width: 100%;
        max-width: 680px;
      }

      .cell {
        display: flex;
        flex-direction: column;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 8px 32px rgba(160, 120, 200, 0.15),
          0 2px 8px rgba(120, 160, 220, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .cell:hover {
        transform: translateY(-6px);
        box-shadow:
          0 16px 48px rgba(160, 120, 200, 0.25),
          0 4px 16px rgba(120, 160, 220, 0.15);
      }

      .cell-label {
        padding: 12px 18px;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cell:nth-child(1) .cell-label {
        background: linear-gradient(90deg, #a8c8f0, #c8a8f0);
      }
      .cell:nth-child(2) .cell-label {
        background: linear-gradient(90deg, #f0a8d8, #c8a8f0);
      }
      .cell:nth-child(3) .cell-label {
        background: linear-gradient(90deg, #a8c8f0, #a8d8f0);
      }
      .cell:nth-child(4) .cell-label {
        background: linear-gradient(90deg, #f0c8a8, #f0a8d8);
      }

      .cell-label .tag {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 0.72rem;
      }

      .iframe-wrap {
        position: relative;
        width: 100%;
        /* 600x400 비율 = 3:2 */
        padding-top: 66.66%;
        overflow: hidden;
      }

      .iframe-wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 400px;
        border: none;
        transform-origin: top left;
        /* 카드 너비(약 310px) / 600px = 0.516 */
        transform: scale(0.516);
      }

      footer {
        margin-top: 48px;
        font-size: 0.8rem;
        color: #b0a0c8;
        font-weight: 300;
        letter-spacing: 0.05em;
      }

      @media (max-width: 540px) {
        #projects {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="subtitle">Creative Coding Portfolio</p>
      <h1>나의 p5.js 작품 모음</h1>
      <p class="desc">p5.js로 만든 4가지 작품을 소개합니다</p>
    </header>

    <main id="projects">
      <div class="cell">
        <div class="cell-label">
          <span class="tag">과제 1</span>
          추상화 그리기
        </div>
        <div class="iframe-wrap">
          <iframe src="sample1/index.html"></iframe>
        </div>
      </div>

      <div class="cell">
        <div class="cell-label">
          <span class="tag">과제 4</span>
          캐릭터 애니메이션
        </div>
        <div class="iframe-wrap">
          <iframe src="sample4/index.html"></iframe>
        </div>
      </div>

      <div class="cell">
        <div class="cell-label">
          <span class="tag">과제 2</span>
          추상화 애니메이션
        </div>
        <div class="iframe-wrap">
          <iframe src="sample2/index.html"></iframe>
        </div>
      </div>

      <div class="cell">
        <div class="cell-label">
          <span class="tag">과제 3</span>
          캐릭터 그리기
        </div>
        <div class="iframe-wrap">
          <iframe src="sample3/index.html"></iframe>
        </div>
      </div>
    </main>

    <footer>made with p5.js &amp; ♡</footer>
  </body>
</html>
